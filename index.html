  } else {
    const names = setupPlayersYatzy.map(n=>n.trim()).filter(Boolean);
    body = `
      <div class="panel">
        <h2>Übersicht</h2>
        <div class="hint" style="margin:0 0 10px">Yahtzee-Style · 13 Kategorien · oberer Bonus ab ${UPPER_BONUS_THRESHOLD}</div>
        ${names.map((n,i)=>`<div class="setup-item"><span class="pos" style="font-family:'Bungee',cursive;color:var(--gold);width:26px">${i+1}.</span><span class="n">${esc(n)}</span></div>`).join('')}
      </div>
      <div class="panel">
        <h2>Als Vorlage speichern</h2>
        <div class="hint" style="margin:0 0 10px">Speichert die Spieler unter einem Namen — praktisch für den nächsten Spieleabend.</div>
        <div class="row">
          <input type="text" id="presetNameInputYatzy" maxlength="24" placeholder="z. B. Stammtisch" autocomplete="off">
          <button class="btn-ivory" onclick="saveCurrentPresetYatzy()" style="flex:none">Speichern</button>
        </div>
      </div>
    `;
  }

  app.innerHTML = `
    ${brandTitle('Yatzy')}
    <div class="sub">Punkteblock für den Würfeltisch</div>
    <div class="stepbar">Schritt <b>${step}</b> von 2 · ${titles[step]}</div>
    ${body}
    <div class="wizard-nav">
      ${step>1 ? `<button class="btn-ghost" onclick="setupStepYatzy--;renderSetupYatzy()">← Zurück</button>` : `<button class="btn-ghost" onclick="backToPicker()">← Spielauswahl</button>`}
      ${step<2
        ? `<button class="btn-primary" onclick="setupNextYatzy()">Weiter →</button>`
        : `<button class="btn-primary" onclick="startYatzy_pickStarter()">Los geht's 🎲</button>`}
    </div>
  `;
  if(step===1){
    app.querySelectorAll('[data-yp]').forEach(inp=>{

function setupNextYatzy(){
  const names = setupPlayersYatzy.map(n=>n.trim()).filter(Boolean);
  if(names.length<1){ showAlert('Mindestens einen Spieler eintragen.'); return; }
  if(names.length<2){ showAlert('Mindestens zwei Spieler eintragen.'); return; }
  setupStepYatzy++;
  renderSetupYatzy();
}
function addYatzyField(){ if(setupPlayersYatzy.length<8){ setupPlayersYatzy.push(''); renderSetupYatzy(); } }
function removeYatzyField(i){ if(setupPlayersYatzy.length>2){ setupPlayersYatzy.splice(i,1); renderSetupYatzy(); } }
function moveYatzyField(i, dir){
  const j = i+dir;
  if(j<0 || j>=setupPlayersYatzy.length) return;
  [setupPlayersYatzy[i], setupPlayersYatzy[j]] = [setupPlayersYatzy[j], setupPlayersYatzy[i]];
  renderSetupYatzy();
}

function startYatzy_pickStarter(){
  const names = disambiguateNames(setupPlayersYatzy.map(n=>n.trim()).filter(Boolean));
  if(names.length<2){ showAlert('Mindestens zwei Spieler eintragen.'); return; }

}
function startYatzy(){
  const names = disambiguateNames(setupPlayersYatzy.map(n=>n.trim()).filter(Boolean));
  if(names.length<2){ showAlert('Mindestens zwei Spieler eintragen.'); return; }

    const s = {}; YATZY_CATS.forEach(c=>s[c.id]=null); return s;
  });
  gameYatzy = {
    players:names, scores, currentIdx:0,

  };

function addLogYatzy(html, cls){ if(gameYatzy){ gameYatzy.log = gameYatzy.log || []; gameYatzy.log.unshift({html, cls:cls||''}); if(gameYatzy.log.length>80) gameYatzy.log.pop(); } }
function logHTMLYatzy(){
  if(!gameYatzy || !gameYatzy.log || !gameYatzy.log.length) return '';
  return `<details class="panel gamelog" open><summary>Protokoll</summary><ul class="log-list">${gameYatzy.log.map(l=>`<li class="${l.cls}">${l.html}</li>`).join('')}</ul></details>`;
}

/* ---------- Spielansicht: Score-Sheet ---------- */
function renderGameYatzy(){
  if(gameYatzy.finished){ renderWinnerScreenYatzy(); return; }
  const cur = gameYatzy.players[gameYatzy.currentIdx];
  const upperRows = YATZY_CATS.filter(c=>c.section==='upper');
  const lowerRows = YATZY_CATS.filter(c=>c.section==='lower');

  function catRow(c){
    const cells = gameYatzy.players.map((p,pi)=>{
      const val = gameYatzy.scores[pi][c.id];
      const filled = val!==null && val!==undefined;
      const isActivePlayer = pi===gameYatzy.currentIdx && !gameYatzy.finished;
      if(filled){
        let diffTag = '';
        if(c.section==='upper'){
          const diff = val - upperIdealYatzy(c.id);
          if(diff!==0){
            diffTag = `<small style="display:block;font-size:.62rem;font-weight:800;color:${diff<0?'var(--red)':'var(--green)'}">${diff>0?'+':''}${diff}</small>`;
          }
        }
        return `<td class="ycell"><span class="fixed">${val}</span>${diffTag}</td>`;
      }
      if(isActivePlayer){
        const opts = c.options().map(v=>`<option value="${v}">${v===0?'0 (gestrichen)':v}</option>`).join('');
        return `<td class="ycell"><select data-ycat="${c.id}" data-yidx="${pi}" onchange="submitYatzyScore('${c.id}',${pi},this.value)"><option value="" disabled selected>–</option>${opts}</select></td>`;
      }
      return `<td class="ycell"><select disabled><option>–</option></select></td>`;
    }).join('');
    return `<tr><td><span class="ycat-name">${c.label}<small>${c.hint}</small></span></td>${cells}</tr>`;
  }

  const upperSumCells = gameYatzy.players.map((p,pi)=>`<td>${upperSumYatzy(gameYatzy.scores[pi])}</td>`).join('');
  const bonusCells = gameYatzy.players.map((p,pi)=>{
    const scores = gameYatzy.scores[pi];
    const sum = upperSumYatzy(scores);
    const bonus = upperBonusYatzy(scores);
    const remaining = Math.max(0, UPPER_BONUS_THRESHOLD - sum);
    if(bonus>0) return `<td>+${bonus}</td>`;
    if(remaining<=0) return `<td>0</td>`;
    const openCats = upperCatsOpenYatzy(scores);
    if(!openCats.length){
      return `<td><span style="color:var(--red);font-weight:700;font-size:.68rem">verpasst</span></td>`;
    }
    const maxRemaining = openCats.reduce((s,c)=>s+UPPER_CAT_MULTIPLIER[c.id]*5, 0);
    if(remaining > maxRemaining){
      return `<td><span style="color:var(--red);font-weight:700;font-size:.68rem">nicht mehr erreichbar</span></td>`;
    }
    const avgNeeded = remaining/openCats.length;
    return `<td><span style="color:var(--ivory-dim);font-weight:600;font-size:.68rem">noch ${remaining} · Ø ${avgNeeded%1===0?avgNeeded:avgNeeded.toFixed(1)}/Kat.</span></td>`;
  }).join('');
  const totalCells = gameYatzy.players.map((p,pi)=>`<td>${totalYatzy(gameYatzy.scores[pi])}</td>`).join('');

  const headRow = `<th>Kategorie</th>${gameYatzy.players.map((p,pi)=>`<th class="${pi===gameYatzy.currentIdx&&!gameYatzy.finished?'ycur':''}">${esc(p)}${pi===gameYatzy.currentIdx&&!gameYatzy.finished?' 🎲':''}</th>`).join('')}`;

  app.innerHTML = `
    ${brandTitle('Yatzy')}
    <div class="sub">${gameYatzy.finished ? 'Spiel beendet' : `${esc(cur)} ist am Zug`}</div>

    <div class="panel">
      <div class="hist-scroll"><table class="yatzy-table">
        <thead><tr>${headRow}</tr></thead>
        <tbody>
          ${upperRows.map(catRow).join('')}
          <tr class="ysection"><td colspan="${gameYatzy.players.length+1}">Oberer Block</td></tr>
          <tr><td>Summe oben</td>${upperSumCells}</tr>
          <tr class="ybonus"><td>Bonus (ab ${UPPER_BONUS_THRESHOLD})</td>${bonusCells}</tr>
          <tr class="ysection"><td colspan="${gameYatzy.players.length+1}">Unterer Block</td></tr>
          ${lowerRows.map(catRow).join('')}
          <tr class="ytotal"><td>Total</td>${totalCells}</tr>
        </tbody>
      </table></div>
      <div class="hint">Feld antippen und Punktzahl aus der Liste wählen. „0 (gestrichen)" wählen, wenn die Kategorie nicht erfüllt wurde. Es ist immer nur der aktuelle Spieler dran.<br>Ideal für den Bonus sind 3 Treffer pro Zahl (z.&nbsp;B. 3× die 4 = 12). Bei weniger zeigt die kleine Zahl unter dem Eintrag die Abweichung (rot = Rückstand), die Bonus-Zeile rechnet, wie viel Schnitt in den restlichen Zahlen-Kategorien jetzt noch nötig ist.</div>
    </div>

    ${logHTMLYatzy()}
    <div class="toolbar">
      <button class="btn-ghost" onclick="undoYatzy()" ${historyYatzy.length?'':'disabled'}>↩ Rückgängig</button>
      <button class="btn-ghost" onclick="confirmResetYatzy()">Neues Spiel</button>
    </div>
    <div style="height:8px"></div>
    <button class="btn-ghost btn-wide" onclick="backToPicker()">← Zur Spielauswahl</button>
  `;
}

function snapshotYatzy(){ historyYatzy.push(JSON.stringify(gameYatzy)); if(historyYatzy.length>60) historyYatzy.shift(); }
function undoYatzy(){
  if(!historyYatzy.length) return;
  gameYatzy = JSON.parse(historyYatzy.pop());
  saveYatzy();
  render();
}

function nextActiveIdxYatzy(from){
  const n = gameYatzy.players.length;
  for(let s=1;s<=n;s++){
    const i=(from+s)%n;
    if(!isCompleteYatzy(gameYatzy.scores[i])) return i;
  }
  return from;
}

function submitYatzyScore(catId, playerIdx, rawVal){
  const val = parseInt(rawVal, 10);
  if(isNaN(val) || val<0){ render(); return; }
  snapshotYatzy();
  gameYatzy.scores[playerIdx][catId] = val;
  const catLabel = YATZY_CATS.find(c=>c.id===catId).label;
  addLogYatzy(`<b>${esc(gameYatzy.players[playerIdx])}</b> trägt bei <b>${catLabel}</b>: <b>${val}</b> ein.`);
  if(catId==='yatzy' && val>0){
    statPlayerYatzy(gameYatzy.players[playerIdx]).yatzyCount++;
    saveStatsYatzy();
  }

  if(isCompleteYatzy(gameYatzy.scores[playerIdx]) && gameYatzy.players.every((p,pi)=>isCompleteYatzy(gameYatzy.scores[pi]))){
    finishYatzy();
  } else {
    gameYatzy.currentIdx = nextActiveIdxYatzy(playerIdx);
  }
  saveYatzy();
  render();
}

function finishYatzy(){
  gameYatzy.finished = true;
  const secs = gameYatzy.startedAt ? Math.max(1, Math.round((Date.now()-gameYatzy.startedAt)/1000)) : null;
  if(secs){
    gameYatzy.durationSec = secs;
    STATS_YATZY.durations.push(secs);
    STATS_YATZY.durations = STATS_YATZY.durations.slice(-200);
  }
  if(!gameYatzy.winnerRecorded){
    const totals = gameYatzy.players.map((p,pi)=>totalYatzy(gameYatzy.scores[pi]));
    let best=-1, bi=-1;
    totals.forEach((t,i)=>{ if(t>best){ best=t; bi=i; } });
    const winnerName = gameYatzy.players[bi];
    statPlayerYatzy(winnerName).wins++;
    if(!STATS_YATZY.bestGame || best > STATS_YATZY.bestGame.total){
      STATS_YATZY.bestGame = {name:winnerName, total:best, d:Date.now()};
    }
    gameYatzy.winnerRecorded = true;
    addLogYatzy(`🏆 <b>${esc(winnerName)}</b> gewinnt mit ${best} Punkten.`, 'round');
    addGameLogEntry('yatzy', winnerName, gameYatzy.players.slice(), {score:best});
  }
  saveStatsYatzy();
}

function confirmResetYatzy(){
  showConfirm('Laufendes Spiel wirklich beenden?', fullResetYatzy);
}
function fullResetYatzy(){
  setupPlayersYatzy=['','']; setupStepYatzy=1;
  gameYatzy=null; historyYatzy=[];
  localStorage.removeItem(YATZY_KEY);
  currentGame=null;
  render();
}
function rematchYatzy_pickStarter(){
  showStarterPick(gameYatzy.players.slice(), 'Yatzy', (order)=>{
    gameYatzy.players = order.map(i=>gameYatzy.players[i]);
    rematchYatzy();
  }, ()=>render());
}
function rematchYatzy(){
  const names = gameYatzy.players.slice();
  const scores = names.map(()=>{ const s={}; YATZY_CATS.forEach(c=>s[c.id]=null); return s; });
  gameYatzy = {
    players:names, scores, currentIdx:0,
    startedAt:Date.now(), durationSec:null,
    finished:false, winnerRecorded:false, log:[]
  };
  names.forEach(n=>statPlayerYatzy(n).games++);
  saveStatsYatzy();
  historyYatzy=[];
  saveYatzy();
  addLogYatzy(`Neue Runde gestartet: ${names.map(n=>`<b>${esc(n)}</b>`).join(', ')}.`, 'round');
  render();
}

/* ---------- Sieger-Bildschirm ---------- */
function renderWinnerScreenYatzy(){
  const totals = gameYatzy.players.map((p,pi)=>({name:p, total:totalYatzy(gameYatzy.scores[pi])}));
  const sorted = [...totals].sort((a,b)=>b.total-a.total);
  const rows = sorted.map((o,i)=>`
    <div class="rank-item">

let h2hState = {a:null, b:null};

/**
 * Generischer Kopf-an-Kopf-Bildschirm für ein einzelnes Spiel.
 * opts = {title, backFn (Funktionsname als String), names, compute(a,b)=>obj, rows(computed)=>[{label,a,b}]}
 */
function renderH2HScreen(opts){
  const { title, backFn, names } = opts;
  if(names.length<2){
    app.innerHTML = `
      ${brandTitle(title)}
      <div class="stat-tabs">
        <button class="stat-tab" onclick="${backFn}()">📊 Übersicht</button>
        <button class="stat-tab on">⚔️ Kopf-an-Kopf</button>
      </div>

      <button class="btn-ghost btn-wide" onclick="backToPicker()">← Zur Spielauswahl</button>
    `;
    return;
  }
  if(!h2hState.a || !names.includes(h2hState.a)) h2hState.a = names[0];
  if(!h2hState.b || !names.includes(h2hState.b) || h2hState.b===h2hState.a) h2hState.b = names.find(n=>n!==h2hState.a) || names[1];

  const optionsA = names.map(n=>`<option value="${esc(n)}" ${n===h2hState.a?'selected':''}>${esc(n)}</option>`).join('');
  const optionsB = names.map(n=>`<option value="${esc(n)}" ${n===h2hState.b?'selected':''}>${esc(n)}</option>`).join('');

  const c = opts.compute(h2hState.a, h2hState.b);
  const rows = opts.rows(c);

  app.innerHTML = `
    ${brandTitle(title)}
    <div class="stat-tabs">
      <button class="stat-tab" onclick="${backFn}()">📊 Übersicht</button>
      <button class="stat-tab on">⚔️ Kopf-an-Kopf</button>

      <div class="h2h-picker">

        <span class="h2h-vs">VS</span>
        <select id="h2hSelB" onchange="h2hState.b=this.value; ${backFn.replace('renderScores','showH2H')}()">${optionsB}</select>
      </div>
      <div class="h2h-card">
        <div class="h2h-names"><span style="color:var(--red)">${esc(h2hState.a)}</span><span style="color:var(--blue)">${esc(h2hState.b)}</span></div>
        ${rows.map(r=>`
          <div class="h2h-row">
            <span class="h2h-num a">${r.a}</span>
            <span class="h2h-label">${esc(r.label)}</span>
            <span class="h2h-num b">${r.b}</span>
          </div>`).join('')}
      </div>
    </div>
    <button class="btn-ghost btn-wide" onclick="backToPicker()">← Zur Spielauswahl</button>
  `;
}

    return {name:n, wins:w30+wT+wY, games:g30+gT+gY, w30, wT, wY, g30, gT, gY};

        <li>
          <span class="val">${c.wins}×</span>
          <span class="who">${esc(c.name)}</span>
          <span class="meta">${c.games} Teilnahmen</span>
        </li>`).join('')}</ol>` : empty('Noch keine Statistiken vorhanden — spielt eine Runde!')}
    </div>

    ${combined.length ? `

      <h2>Aufschlüsselung pro Spiel</h2>
      ${combined.slice(0,8).map(c=>`

/* ---------- Partien-Verlauf: kompletter Log, einzeln löschbar ---------- */
function deleteGameLogEntry(idx){
  const entry = GAME_LOG[idx];
  if(!entry) return;
  showConfirm(`Partie "${GAME_LABELS[entry.game]||entry.game}" (Sieger: ${entry.winner}) wirklich löschen? Sieg/Teilnahme werden auch aus der Spielstatistik entfernt.`, ()=>{
    const statObj = entry.game==='30er' ? STATS30 : entry.game==='tutto' ? STATS_TUTTO : STATS_YATZY;
    const winnerStat = statObj.players[entry.winner];
    if(winnerStat && winnerStat.wins>0) winnerStat.wins--;
    (entry.players||[]).forEach(name=>{
      const p = statObj.players[name];
      if(p && p.games>0) p.games--;
    });
    if(entry.game==='30er') saveStats30();
    else if(entry.game==='tutto') saveStatsTutto();
    else saveStatsYatzy();
    GAME_LOG.splice(idx,1);
    saveGameLog();
    render();
  });
}

/* ---------- Export / Import aller lokalen Daten ---------- */
const ALL_DATA_KEYS = [
  STATS_KEY_30, PRESET_KEY_30,
  TUTTO_KEY, TUTTO_STATS_KEY, PRESET_KEY_TUTTO,
  YATZY_KEY, YATZY_STATS_KEY, PRESET_KEY_YATZY,
  GAMELOG_KEY
];
function exportAllData(){
  const data = {app:'Dice-Games', exportedAt:new Date().toISOString(), values:{}};
  ALL_DATA_KEYS.forEach(k=>{ const v = localStorage.getItem(k); if(v!==null) data.values[k]=v; });
  const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `dice-games-backup-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}
function importAllData(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const data = JSON.parse(reader.result);
      if(!data || typeof data.values!=='object') throw new Error('invalid');
      showConfirm('Import überschreibt alle vorhandenen lokalen Statistiken und Vorlagen. Fortfahren?', ()=>{
        Object.entries(data.values).forEach(([k,v])=>{ if(ALL_DATA_KEYS.includes(k)) safeSetItem(k, v); });
        STATS30 = loadStats30(); PRESETS30 = loadPresets30();
        STATS_TUTTO = loadStatsTutto(); PRESETS_TUTTO = loadPresetsTutto(); loadTutto();
        STATS_YATZY = loadStatsYatzy(); PRESETS_YATZY = loadPresetsYatzy(); loadYatzy();
        GAME_LOG = loadGameLog();
        render();
        showAlert('Import abgeschlossen.');
      });
    }catch(e){ showAlert('Datei konnte nicht gelesen werden — ist es eine gültige Dice-Games-Sicherung?'); }
    $('#importFile').value = '';
  };
  reader.readAsText(file);
}

      // Worker ruft bereits skipWaiting()/clients.claim() auf).
      reg.addEventListener('updatefound', () => {
        const nw = reg.installing;
        if(!nw) return;
        nw.addEventListener('statechange', () => {
          if(nw.state==='activated' && navigator.serviceWorker.controller) reg.update();
        });
      });
      // Regelmässig auf neue Version prüfen, damit Updates nicht erst beim

      setInterval(()=>reg.update().catch(()=>{}), 60*60*1000);
    }).catch(()=>{});
  });
  // Sobald ein neuer Service Worker übernimmt, die Seite einmalig neu laden,
  // damit Updates automatisch ankommen — kein manuelles Cache-Leeren mehr nötig.
  let swRefreshed = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if(swRefreshed) return;
    swRefreshed = true;
    window.location.reload();
  });
}
</script>
